<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Databricks story · databricksedu</title>
<style>
  :root { --paper: #fbfaf5; --ink: #2c2a26; --accent: #d1682e; --soft: #8f897c; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0 0 56px 0; display: flex; align-items: center; justify-content: center; }
  #stage img { position: absolute; max-width: 100%; max-height: 100%; object-fit: contain;
    opacity: 0; transform: translateY(8px); transition: opacity .45s ease, transform .45s ease; }
  #stage img.on { opacity: 1; transform: none; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; height: 56px; display: flex; align-items: center;
    gap: 12px; padding: 0 16px; box-sizing: border-box; border-top: 1px solid #e8e4d8; background: var(--paper); }
  button { border: 1px solid #d9d3c3; background: #fff; color: var(--ink); border-radius: 10px; padding: 8px 14px;
    font: 600 14px/1 inherit; cursor: pointer; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  #dots { flex: 1; display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }
  #dots span { width: 8px; height: 8px; border-radius: 50%; background: #ddd7c7; cursor: pointer; }
  #dots span.on { background: var(--accent); width: 22px; border-radius: 6px; }
  #count { color: var(--soft); font-size: 13px; min-width: 52px; text-align: right; }
  #prev, #next { position: fixed; top: 0; bottom: 56px; width: 18%; background: transparent; border: 0; border-radius: 0;
    cursor: pointer; padding: 0; }
  #prev { left: 0; cursor: w-resize; } #next { right: 0; cursor: e-resize; }
  #prev:hover, #next:hover { background: transparent; }
  @media (max-width: 600px) { #dots { display: none; } }
</style>
</head>
<body>
<div id="stage"></div>
<button id="prev" aria-label="Previous slide"></button>
<button id="next" aria-label="Next slide"></button>
<div id="bar">
  <button id="bPrev" title="Previous (←)">←</button>
  <div id="dots"></div>
  <span id="count"></span>
  <button id="bFull" title="Full screen (F)">⛶</button>
  <button id="bNext" title="Next (→)">Next →</button>
</div>
<script>
(function () {
  var N = 20, i = 0, stage = document.getElementById('stage'), imgs = [];
  for (var k = 1; k <= N; k++) {
    var im = document.createElement('img');
    im.src = 'slides/s-' + (k < 10 ? '0' : '') + k + '.jpg';
    im.alt = 'The Databricks story, slide ' + k;
    im.loading = k < 3 ? 'eager' : 'lazy';
    stage.appendChild(im); imgs.push(im);
    var d = document.createElement('span'); d.dataset.k = k - 1;
    d.onclick = function () { go(+this.dataset.k); };
    document.getElementById('dots').appendChild(d);
  }
  var dots = document.getElementById('dots').children;
  function go(n) {
    i = Math.max(0, Math.min(N - 1, n));
    for (var k = 0; k < N; k++) { imgs[k].classList.toggle('on', k === i); dots[k].classList.toggle('on', k === i); }
    if (imgs[i + 1]) imgs[i + 1].loading = 'eager';
    document.getElementById('count').textContent = (i + 1) + ' / ' + N;
    document.getElementById('bNext').textContent = i === N - 1 ? 'Back to start' : 'Next →';
    try { history.replaceState(null, '', '#' + (i + 1)); } catch (e) { }
  }
  function next() { go(i === N - 1 ? 0 : i + 1); }
  function full() {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  }
  document.getElementById('prev').onclick = document.getElementById('bPrev').onclick = function () { go(i - 1); };
  document.getElementById('next').onclick = document.getElementById('bNext').onclick = next;
  document.getElementById('bFull').onclick = full;
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') go(i - 1);
    else if (e.key === 'Home') go(0);
    else if (e.key === 'End') go(N - 1);
    else if (e.key === 'f' || e.key === 'F') full();
  });
  var x0 = null;
  stage.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend', function (e) {
    if (x0 === null) return; var dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 40) go(dx < 0 ? i + 1 : i - 1);
  });
  go((parseInt(location.hash.slice(1), 10) || 1) - 1);
})();
</script>
<script src="../_shared/back.js"></script>
</body>
</html>

name: Publish to PyPI
# Push a tag like v0.1.0 (it must match src/databricksedu/_version.py), or run it by hand.
# Needs the repository secret PYPI_API_TOKEN (a PyPI API token, starting with "pypi-").
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown pygments pytest build twine
      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v=$(python -c "import re;print(re.search(r'\"(.+)\"', open('src/databricksedu/_version.py').read()).group(1))")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version $v"; exit 1; }
      - run: python tools/build.py
      - run: python -m pytest -q
      - run: python -m build && twine check dist/*
      - name: Upload
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*

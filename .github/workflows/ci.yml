name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install markdown pygments pytest build twine
      - name: Build the content (fails if any module is invalid)
        run: python tools/build.py
      - run: python -m pytest -q
      - name: Build the package
        run: python -m build && twine check dist/*

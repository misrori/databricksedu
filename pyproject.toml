[build-system]
# markdown + pygments are only needed at build time: hatch_build.py renders content/ into the package.
requires = ["hatchling>=1.24", "markdown>=3.5", "pygments>=2.17"]
build-backend = "hatchling.build"

[project]
name = "databricksedu"
dynamic = ["version"]
description = "Bite-sized Databricks lessons that run inside your notebook: animated slides, notes, exercises and seeded demo data."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Mihály Orsós" }]
keywords = ["databricks", "education", "delta lake", "spark", "unity catalog", "training", "certification"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Framework :: Jupyter",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
    "Topic :: Database",
]
# No hard dependencies: everything the package needs at run time is preinstalled on Databricks.
dependencies = []

[project.optional-dependencies]
# Outside Databricks: the Save-to-workspace buttons and save() need these.
workspace = ["databricks-sdk>=0.20", "ipywidgets>=8"]
pandas = ["pandas"]
dev = ["pytest", "markdown>=3.5", "pygments>=2.17", "build", "twine"]

[project.urls]
Homepage = "https://github.com/misrori/databricksedu"
Source = "https://github.com/misrori/databricksedu"
"Practice exams" = "https://goldhandacademy.com"

[tool.hatch.version]
path = "src/databricksedu/_version.py"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/databricksedu"]
exclude = ["**/__pycache__"]
# generated by the build hook and git-ignored, so they must be listed explicitly
artifacts = ["src/databricksedu/_content/**", "src/databricksedu/assets/**"]

[tool.hatch.build.targets.sdist]
include = ["src/databricksedu", "content", "tools/build.py", "tools/render.py", "tools/assets", "hatch_build.py",
           "README.md", "LICENSE", "CONTENT_GUIDE.md", "tests"]
exclude = ["**/__pycache__"]
artifacts = ["src/databricksedu/_content/**", "src/databricksedu/assets/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
